<script>
// Generated by npm run build:standalone; edit src modules instead.
// Zero means unknown. Limits protect the inspector, not a claim about model architectures.
const STRUCTURE_LIMITS = {layers:4096, heads:4096, kvHeads:4096, experts:4096, activeExperts:4096, hidden:1000000, ffn:100000000, context:1000000000, vocab:10000000};

function getLayerIndex(name) {
 const match = name.match(/(?:^|\.)(?:blk|layers|h|blocks)\.(\d+)\./);
 return match ? Number(match[1]) : null;
}

function validateModelStructure(model) {
 for (const [key, max] of Object.entries(STRUCTURE_LIMITS)) {
  const value = model[key];
  if (!Number.isSafeInteger(value) || value < 0 || value > max) {
   throw new Error(`Некорректный параметр ${key}: ожидается целое число от 0 до ${max}`);
  }

const graphDefs=`<defs><linearGradient id="violetNode" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#382d67"/><stop offset="1" stop-color="#1d243f"/></linearGradient><linearGradient id="tealNode" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174b51"/><stop offset="1" stop-color="#132b39"/></linearGradient><linearGradient id="neutralNode" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#222f4b"/><stop offset="1" stop-color="#171f34"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrV" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a08cf6"/></marker><marker id="arrT" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55cfc0"/></marker></defs>`;
function arrow(x1,y1,x2,y2,teal=false,dash=false){let my=(y1+y2)/2;let d=Math.abs(y1-y2)>24?`M${x1} ${y1} C${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`:`M${x1} ${y1} L${x2} ${y2}`;return `<path d="${d}" stroke="${teal?'#63d3c7':'#8b7dd0'}" stroke-width="2" fill="none" opacity=".86" ${dash?'stroke-dasharray="5 6"':''} marker-end="url(#${teal?'arrT':'arrV'})"/>`}
function node(id,x,y,w,h,title,sub,{kind='violet',tag='',icon='⬡',small=false}={}){let selected=S.selected===id;let grad=kind==='teal'?'tealNode':kind==='neutral'?'neutralNode':'violetNode',stroke=kind==='teal'?'#418e91':kind==='neutral'?'#415575':'#7061a4';let tSize=small?15:17;return `<g class="graph-node ${selected?'selected':''}" data-node="${esc(id)}" tabindex="0" role="button" aria-label="${esc(title)}"><rect class="block-outline" x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="url(#${grad})" stroke="${stroke}" stroke-width="1.35"/><rect x="${x+2}" y="${y+2}" width="${w-4}" height="${Math.min(35,h-4)}" rx="12" fill="#ffffff" fill-opacity=".023"/><text x="${x+18}" y="${y+Math.min(34,h/2)}" fill="${kind==='teal'?'#83e6d9':'#d2c7ff'}" font-size="${small?17:20}" font-weight="650">${icon}</text><text x="${x+47}" y="${y+Math.min(33,h/2)}" fill="#f0efff" font-size="${tSize}" font-weight="750">${esc(title)}</text>${sub?`<text x="${x+47}" y="${y+Math.min(57,h-13)}" fill="#9faec7" font-size="12">${esc(sub)}</text>`:''}${tag?`<text x="${x+w-16}" y="${y+25}" font-size="10" font-weight="750" fill="${kind==='teal'?'#86e6d3':'#c5b9ff'}" text-anchor="end">${esc(tag)}</text>`:''}</g>`}
function textSvg(x,y,t,size=12,color='#9eabc4',anchor='start',weight=500){return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" fill="${color}" font-weight="${weight}">${esc(t)}</text>`}
function groupOutline(x,y,w,h,kind='violet'){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="${kind==='teal'?'#163a3b':'#292341'}" fill-opacity=".48" stroke="${kind==='teal'?'#426968':'#625681'}" stroke-width="1.35" stroke-dasharray="7 5"/>`}
function graphOverview(){const m=S.model,isM=m.isMoe;return `${arrow(430,92,430,138)}${arrow(430,224,430,270)}${arrow(430,536,430,606)}${arrow(430,674,430,717)}${node('tokens',302,16,256,76,'Входные токены','Token IDs · последовательность',{icon:'✣',kind:'neutral'})}${node('embedding',294,138,272,86,'Embedding',m.hidden?`${numfmt(m.hidden)} измерений`:'Векторные представления',{icon:'◈'})}${`<g class="graph-node" data-node="transformer">`}${groupOutline(154,272,552,265,isM?'teal':'violet')}${textSvg(182,308,'TRANSFORMER BLOCK',15,'#ebefff','start',750)}${textSvg(182,329,`Повторяется ${numfmt(m.layers)} раз`,12,'#9ca9be')}${textSvg(673,309,`× ${numfmt(m.layers)}`,19,isM?'#7de0d2':'#bcaeff','end',750)}${arrow(303,430,475,430,isM)}${node('attention',180,370,239,102,'Attention',`${numfmt(m.heads)} heads · KV ${numfmt(m.kvHeads)}`,{icon:'◎',kind:'neutral'})}${node(isM?'moe':'ffn',440,370,238,102,isM?'MoE / Experts':'FFN / MLP',isM?`${numfmt(m.activeExperts)} / ${numfmt(m.experts)} experts`:'Полносвязная сеть',{icon:isM?'⬡':'✳',kind:isM?'teal':'violet'})}${textSvg(430,512,'Нажмите на блок, чтобы раскрыть устройство',11,'#a3b0c7','middle')}</g>${node('normalization',305,606,250,68,'Final Norm','Нормализация состояний',{kind:'neutral',icon:'≈',small:true})}${node('output',305,717,250,65,'LM Head','Логиты следующего токена',{kind:'violet',icon:'➤',small:true})}`}
function graphLayer(){const m=S.model,isM=m.isMoe;const x=286;return `${arrow(426,77,426,120)}${arrow(426,184,426,227)}${arrow(426,314,426,354)}${arrow(426,414,426,462)}${arrow(426,526,426,568)}${arrow(426,658,426,707)}${arrow(426,768,426,812)}${node('layer-input',x+8,10,260,67,`Layer ${S.layer} · Input`,'Hidden states',{kind:'neutral',icon:'⇢',small:true})}${node('attn-norm',x,120,280,64,'Attention Norm','RMSNorm / LayerNorm',{kind:'neutral',icon:'≈',small:true})}${node('attention',x-20,227,320,87,'Self Attention',`${numfmt(m.heads)} Q heads · ${numfmt(m.kvHeads)} KV heads`,{kind:'violet',icon:'◎'})}${node('residual-attn',x+5,354,270,60,'Residual Add','skip connection',{kind:'neutral',icon:'+',small:true})}${node('ffn-norm',x,462,280,64,'FFN Norm','Нормализация',{kind:'neutral',icon:'≈',small:true})}${node(isM?'moe':'ffn',x-20,568,320,90,isM?'MoE · Router + Experts':'FFN · SwiGLU',isM?`${numfmt(m.activeExperts)} из ${numfmt(m.experts)} экспертов`:'gate / up / down projections',{kind:isM?'teal':'violet',icon:isM?'⬡':'✳'})}${node('residual-ffn',x+5,707,270,61,'Residual Add','skip connection',{kind:'neutral',icon:'+',small:true})}${node('layer-output',x+5,812,270,64,'Output','Следующий Transformer block',{kind:'neutral',icon:'⇢',small:true})}${textSvg(110,250,'Multi-head / GQA',14,'#a5b4ca')}${textSvg(110,272,'Q · K · V · O',12,'#71849d')}${textSvg(610,600,isM?'Sparse FFN':'Dense FFN',14,'#85e2d5')}${textSvg(610,624,isM?'Router выбирает top-k':'Все веса активны',11,'#8799b0')}`}
function graphInternals(){const m=S.model,isM=m.isMoe;let g=`${node('ffn-input',314,42,240,70,'Hidden States',`${numfmt(m.hidden)} dims`,{kind:'neutral',icon:'⇢'})}${arrow(434,112,434,171,isM)}`;

  g+=`${textSvg(430,483,'Отображены 5 из пула; подсветка иллюстративная',10,'#91abaf','middle')}${node('merge',300,574,268,75,'Weighted Sum','Взвешенное объединение',{kind:'teal',icon:'∑'})}${arrow(434,649,434,714,true)}${node('ffn-output',314,714,240,70,'Output',`${numfmt(m.hidden)} dims`,{kind:'neutral',icon:'⇢'})}`;
 } else {g+=`${node('gate-proj',95,220,258,91,'Gate projection',`→ ${numfmt(m.ffn)} dims`,{icon:'✳',kind:'violet'})}${node('up-proj',505,220,258,91,'Up projection',`→ ${numfmt(m.ffn)} dims`,{icon:'↗',kind:'violet'})}${arrow(434,112,225,220)}${arrow(434,112,634,220)}${arrow(225,311,434,412)}${arrow(634,311,434,412)}${node('activation',289,412,290,90,'SwiGLU / Activation','Gate × Up',{icon:'✶',kind:'violet'})}${arrow(434,502,434,551)}${node('down-proj',289,551,290,90,'Down projection',`→ ${numfmt(m.hidden)} dims`,{icon:'↘',kind:'violet'})}${arrow(434,641,434,705)}${node('ffn-output',309,705,250,70,'Output','Hidden states',{kind:'neutral',icon:'⇢'})}`;}
 return g;

function breadcrumb(){return S.depth==='overview'?'Модель / Общая архитектура':S.depth==='layer'?`Модель / Transformer / Layer ${S.layer}`:`Модель / Layer ${S.layer} / ${S.model.isMoe?'MoE Experts':'Dense FFN'}`}
function graphViz(){const page=S.depth;let body=page==='overview'?graphOverview():page==='layer'?graphLayer():graphInternals();let canonicalHeight=page==='layer'?900:page==='overview'?800:800;let vb=S.view;if(vb.h!==canonicalHeight && vb.w===860){vb={x:0,y:0,w:860,h:canonicalHeight};S.view=vb;}return `<section class="section-box"><div class="viz-head"><div><div class="viz-title">Структурная схема <span style="color:#65748c;font-weight:500">/ ${esc(page==='overview'?'Overview':page==='layer'?'Transformer layer':'FFN internals')}</span></div><div class="viz-hint">${esc(breadcrumb())}</div></div><div class="viz-controls">${page!=='overview'?button('← Назад','back','tiny-btn'):''}${button('−','zoom-out','icon-btn')}${button('+','zoom-in','icon-btn')}${button('⤢','fit','icon-btn')}</div></div><div class="stage"><svg id="graph" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${graphDefs}${body}</svg><div class="stage-pill">${page==='overview'?'01 / Обзор модели':page==='layer'?`02 / Layer ${S.layer}`:'03 / Внутренний блок'} &nbsp; · &nbsp; ${S.model.source==='demo'?'ДЕМО':'ЛОКАЛЬНЫЕ ДАННЫЕ'}</div><div class="stage-bottom"><span class="legend-dot"></span> Dense / универсальные блоки &nbsp; <span class="legend-dot green"></span> MoE / experts</div></div><div class="viz-footer"><span>◇ Масштабирование колесом / + −</span><span>✋ Перемещение перетаскиванием</span><span class="push">${S.depth==='overview'?'Нажмите на Transformer или FFN':S.depth==='layer'?'Нажмите на FFN / MoE для детализации':'Стрелки показывают логические зависимости'}</span></div></section><div class="bottom-note"><span class="note-ico">ⓘ</span><div><h3>${S.model.source==='demo'?'Демонстрационная схема — не данные реальной модели':'Структура реконструирована по метаданным и именам тензоров'}</h3><p>Граф показывает типовую архитектуру семейства Transformer. Точные операции, размещение residual-связей и routing определяются кодом реализации. Маршруты экспертов в демонстрации условные: фактические активации требуют выполнения модели.</p></div></div>`}
function filterTensor(){let q=S.search.toLowerCase().trim();return q?S.model.tensors.filter(t=>t.name.toLowerCase().includes(q)||t.dtype.toLowerCase().includes(q)):S.model.tensors}
function tensorPanel(){let arr=filterTensor(),p=clamp(S.page,0,Math.max(0,Math.ceil(arr.length/20)-1)),slice=arr.slice(p*20,p*20+20);S.page=p;return `<div class="section-intro"><h2>Каталог тензоров</h2><p>Поиск по именам, размерностям и типам хранения. Отображаются метаданные файлов — значения весов не загружаются.</p></div><section class="table-panel"><div class="table-tools"><div><h2>${compact(S.model.tensors.length,0)} тензоров</h2><p>${S.model.source==='demo'?'Пример с синтетическими именами тензоров':'Из заголовков выбранных файлов'}</p></div><div class="filter-box">⌕ <input id="tensorSearch" value="${esc(S.search)}" placeholder="Поиск по имени или dtype…"/></div></div><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Тензор</th><th>Размерность</th><th>Тип</th><th>Элементов</th></tr></thead><tbody>${slice.map(t=>`<tr data-tensor="${esc(t.name)}" style="cursor:pointer"><td class="mono" title="${esc(t.name)}">${esc(t.name)}</td><td>${esc(t.shape.join(' × '))}</td><td><span class="chip ${/Q|IQ/.test(t.dtype)?'purple':'green'}">${esc(t.dtype)}</span></td><td>${paramsFmt(t.elements)}</td></tr>`).join('')||`<tr><td colspan="4" style="text-align:center;color:#7c8ca5;padding:45px">Ничего не найдено</td></tr>`}</tbody></table></div><div class="table-foot"><span>${arr.length?`${p*20+1}–${Math.min((p+1)*20,arr.length)} из ${arr.length}`:'0 из 0'} ${S.model.partial?'· неполный набор':''}</span><div class="paging"><button data-action="prev-page" ${p===0?'disabled':''}>← Назад</button><button data-action="next-page" ${p>=Math.ceil(arr.length/20)-1?'disabled':''}>Далее →</button></div></div></section>`}
function calculateMemory(){const r=estimateMemory(S.model,S.ctx,S.batch);return {...r,extra:r.buffer,ctx:r.context};}
function memoryPanel(){const {kv,weights,extra,total,ctx,weightsKnown}=calculateMemory();const gpus=[{name:'NVIDIA RTX 5090',capacity:32,sub:'32 GB GDDR7 · одна видеокарта'},{name:'Ryzen AI Max+ 395',capacity:96,sub:'до 96 GB UMA · зависит от настройки'},{name:'6 × Tesla P40',capacity:144,sub:'6 × 24 GB · не единый пул памяти'}];const gauge=(n,cap,cls)=>`<div class="${cls}" style="width:${Math.min(100,n/cap*100)}%"></div>`;
 return `<div class="section-intro"><h2>Планировщик памяти</h2><p>Оценка минимальной памяти для весов и KV-cache. Не учитывает все особенности backend, offload, временные буферы и распределение по устройствам.</p></div><div class="memory-tools"><label>Контекст &nbsp;<strong>${compact(ctx/1024,0)}K токенов</strong> &nbsp; (batch: ${S.batch})</label><input id="ctxSlider" type="range" min="11" max="17" value="${Math.round(Math.log2(S.ctx))}" step="1"/><div style="display:flex;gap:6px">${[1,2,4].map(b=>`<button class="tiny-btn" style="${S.batch===b?'border-color:#8976ff;color:#d3caff':''}" data-batch="${b}">B${b}</button>`).join('')}</div></div><div class="memory-breakdown">${[['Веса на диске',weights],['KV-cache FP16',kv],['Условный резерв',extra]].map(([label,n],i)=>`<div class="breakdown-card"><span>${label}</span><strong style="color:${['#b6a7ff','#81e1d4','#f4c18b'][i]}">${n==null?'Неизвестно':compact(n,2)+' GB'}</strong></div>`).join('')}</div><div class="memory-legend"><span><i style="background:#8c76f9"></i>Веса</span><span><i style="background:#55d2c4"></i>KV-cache</span><span><i style="background:#e4a770"></i>Резерв</span></div><div class="memory-cards list-focus">${gpus.map(g=>`<div class="memory-card"><div class="eyebrow">Устройство</div><h3>${g.name}</h3><div class="capacity">${g.sub}</div><div class="memory-gauge">${gauge(weights,g.capacity,'weights')}${gauge(kv,g.capacity,'kv')}${gauge(extra,g.capacity,'extra')}</div><div class="memory-value" style="color:${!weightsKnown?'#889ab3':total<=g.capacity?'#bdcafa':'#e8ad84'}">${weightsKnown?compact(total,1):'—'} / ${g.capacity} GB</div><div class="memory-status">${!weightsKnown?'Недостаточно данных о весах':total<=g.capacity?'✓ Теоретически по объёму помещается':'⚠ Оценка превышает объём'}${g.name.includes('P40')?' · потребуется распределение весов':''}</div></div>`).join('')}</div><div class="bottom-note"><span class="note-ico">ⓘ</span><div><h3>Ограничения оценки</h3><p>Для GGUF объём файла принят за приближённый размер весов; в SafeTensors значения могут быть иными после загрузки и конвертации. KV-cache оценён как FP16: 2 × слои × KV-головы × размер головы × контекст × batch. MoE не уменьшает общий объём весов автоматически.</p></div></div>`}

 if(sel==='ffn'||sel.includes('proj')||sel==='activation')res=item('Feed Forward Network',`blocks.${S.layer}.ffn`,'Преобразование признаков отдельно для каждого токена. В плотном варианте используются полные проекции Gate, Up и Down (например, SwiGLU).','✳',[['FFN width',numfmt(m.ffn)],['Hidden width',numfmt(m.hidden)],['Выполнение','На каждом токене']],['ffn_','mlp.','gate_proj','up_proj','down_proj']);
 if(sel.includes('norm')||sel==='normalization')res=item('Normalization',`blocks.${S.layer}.norm`,'Нормализует представления. В зависимости от архитектуры может использоваться RMSNorm или LayerNorm.','≈',[['Размер вектора',numfmt(m.hidden)],['Тип','Зависит от архитектуры']],['norm']);
 if(sel==='output')res=item('Language Modeling Head','output / lm_head','Проекция скрытого состояния в логиты словаря, по которым алгоритм декодирования выбирает следующий токен.','➤',[['Размер словаря',numfmt(m.vocab)],['Выходных значений',numfmt(m.vocab)]],['output.weight','lm_head']);
 if(sel==='merge')res=item('Expert aggregation','moe.combine','Объединяет выходы выбранных экспертов с учётом весов маршрутизатора.','∑',[['Выходной hidden',numfmt(m.hidden)],['Активных экспертов',numfmt(m.activeExperts)]],['experts'],'teal');
 return res;}
function inspector(){let m=S.model,c=getComponent();let terms=c.terms||[];let matches=terms.length?m.tensors.filter(t=>terms.some(s=>t.name.includes(s))&&(S.depth==='overview'||t.name.includes(`.${S.layer}.`)||t.name.includes(`layers.${S.layer}.`)||t.name.includes(`blk.${S.layer}.`))).slice(0,4):[];return `<aside class="inspector"><div class="ins-head"><div class="eyebrow">Инспектор компонентов</div><h2>Свойства элемента</h2><p>Нажмите на любой блок схемы, чтобы увидеть его параметры.</p></div><div class="ins-body"><div class="component-symbol ${c.tone==='teal'?'teal':''}">${c.icon}</div><div class="component-name">${esc(c.title)}</div><span class="chip ${m.source==='demo'?'purple':'green'}">${m.source==='demo'?'ДЕМО':'ПО МЕТАДАННЫМ'}</span><div class="component-path" title="${esc(c.path)}">${esc(c.path)}</div><div class="component-desc">${esc(c.desc)}</div><div class="property-title">Параметры <span>⦿</span></div>${c.props.map(([k,v])=>`<div class="property-row"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}<div class="property-title">Связанные тензоры <span>${matches.length?`≥ ${matches.length}`:'—'}</span></div>${matches.length?matches.map(t=>`<div class="tensor-entry"><div class="tensor-name" title="${esc(t.name)}">${esc(t.name)}</div><div class="tensor-shape">${esc(t.shape.join(' × '))} &nbsp;·&nbsp; ${esc(t.dtype)}</div></div>`).join(''):`<div class="ins-empty">${m.source==='demo'?'В демонстрации показаны примерные имена тензоров.':'Нет подходящих тензоров в выбранном файле.'}</div>`}<div class="ins-action">${S.depth==='overview'?button('↳ Раскрыть слой','to-layer','soft-btn'):S.depth==='layer'?button('↳ Внутрь FFN','to-ffn','soft-btn'):button('← К слою','back','soft-btn')}${button('▦ Тензоры','tensors','soft-btn')}</div><div class="property-title">Уровень уверенности</div><div class="component-desc" style="color:#889ab3">${m.source==='demo'?'Синтетический пример интерфейса, не описание реальных весов.':'Параметры основаны на метаданных; топология является реконструкцией типового Transformer.'}</div></div></aside>`}
let collapsed=false;try{collapsed=localStorage.getItem('llm-sidebar-collapsed')==='true'}catch{};
function dashboard(){
 const shell=root.querySelector('.app-shell');shell.classList.add('dashboard');shell.classList.toggle('collapsed',collapsed);
 const sidebar=root.querySelector('.sidebar'),header=root.querySelector('.topbar');
 sidebar.prepend(header.querySelector('.brand'));header.querySelector('.top-mid')?.remove();
 const toggle=document.createElement('button');toggle.className='icon-btn collapse-toggle';toggle.textContent=collapsed?'›':'‹';toggle.setAttribute('aria-label','Свернуть или развернуть меню');toggle.onclick=()=>{collapsed=!collapsed;try{localStorage.setItem('llm-sidebar-collapsed',collapsed)}catch{};render()};sidebar.prepend(toggle);
 sidebar.querySelectorAll('.sb-nav button').forEach(b=>{b.title=b.textContent.trim();b.setAttribute('aria-label',b.title);const icon=b.querySelector('.ico');const label=document.createElement('span');label.className='nav-label';label.textContent=b.title;b.replaceChildren(icon,label)});
 const menu=document.createElement('button');menu.className='icon-btn mobile-menu';menu.textContent='☰';menu.setAttribute('aria-label','Открыть меню');const closeMenu=()=>{shell.classList.remove('menu-open');menu.setAttribute('aria-expanded','false');menu.focus()};menu.setAttribute('aria-expanded','false');menu.onclick=()=>{shell.classList.add('menu-open');menu.setAttribute('aria-expanded','true');close.focus()};header.prepend(menu);
 const backdrop=document.createElement('button');backdrop.className='menu-backdrop';backdrop.tabIndex=-1;backdrop.setAttribute('aria-label','Закрыть меню по фону');backdrop.onclick=closeMenu;shell.append(backdrop);
 const close=document.createElement('button');close.className='icon-btn mobile-close';close.textContent='×';close.setAttribute('aria-label','Закрыть меню');close.onclick=closeMenu;sidebar.prepend(close);
 const tree=sidebar.querySelector('section');if(S.screen==='architecture'){tree.classList.add('architecture-tree');root.querySelector('.main').append(tree)}else{tree.remove();root.querySelector('.inspector')?.remove()}
}
function render(){root.innerHTML=`<div class="app-shell">${topbar()}<div class="workspace">${sideNav()}<main class="main">${heading()}${S.screen==='architecture'?graphViz():S.screen==='tensors'?tensorPanel():memoryPanel()}</main>${inspector()}</div></div>${S.toast?`<div class="toast">${esc(S.toast)}</div>`:''}`;dashboard();wireGraph();}
function resetView(){let h=S.depth==='layer'?900:800;S.view={x:0,y:0,w:860,h};}
function changeDepth(d){S.depth=d;S.selected=d==='overview'?'transformer':d==='layer'?'attention':S.model.isMoe?'router':'ffn';resetView();render()}
function selectNode(id){S.selected=id;if(id==='transformer'&&S.depth==='overview')S.depth='layer';else if((id==='moe'||id==='ffn')&&S.depth!=='internals')S.depth='internals';else if(id==='attention'&&S.depth==='overview')S.depth='layer';else if(id.startsWith('expert-')&&S.depth!=='internals')S.depth='internals';resetView();render()}
function setScreen(screen){S.screen=screen;render()}
function switchDemo(k){S.model=k==='moe'?demoMoe:demoDense;S.layer=0;S.depth='overview';S.selected='transformer';S.search='';S.page=0;S.layerSearch='';S.showAllLayers=false;resetView();render()}
function exportData(){let m=S.model;let blob=new Blob([JSON.stringify({...m,tensors:m.tensors.slice(0,20000)},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${m.name.replace(/[^a-z0-9-]+/ig,'_')}-anatomy.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function graphZoom(factor){let b=S.view,cx=b.x+b.w/2,cy=b.y+b.h/2;let w=clamp(b.w*factor,300,1800),h=clamp(b.h*factor,300,1800);S.view={x:cx-w/2,y:cy-h/2,w,h};updateViewBox()}
function updateViewBox(){let g=document.querySelector('#graph');if(g)g.setAttribute('viewBox',`${S.view.x} ${S.view.y} ${S.view.w} ${S.view.h}`)}
function wireGraph(){let g=document.querySelector('#graph');if(!g)return;g.addEventListener('wheel',e=>{e.preventDefault();graphZoom(e.deltaY>0?1.13:1/1.13)},{passive:false});let p=null;g.addEventListener('pointerdown',e=>{if(e.target.closest('.graph-node'))return;p={x:e.clientX,y:e.clientY,view:{...S.view}};g.classList.add('dragging');g.setPointerCapture(e.pointerId)});g.addEventListener('pointermove',e=>{if(!p)return;let box=g.getBoundingClientRect(),scale=Math.max(p.view.w/box.width,p.view.h/box.height);S.view.x=p.view.x-(e.clientX-p.x)*scale;S.view.y=p.view.y-(e.clientY-p.y)*scale;updateViewBox()});const end=()=>{p=null;g.classList.remove('dragging')};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);}
async function loadFiles(files){if(!files?.length)return;const prev=S.model;S.loading=true;document.querySelector('.brand').classList.add('busy');try{let model=await openModelFiles(files);S.model=model;S.layer=0;S.depth='overview';S.selected='transformer';S.screen='architecture';S.search='';S.page=0;S.layerSearch='';resetView();render();banner(`Открыто: ${model.name}. Найдено ${compact(model.tensors.length,0)} тензоров.`)}catch(err){S.model=prev;banner('Не удалось прочитать файл: '+err.message)}finally{S.loading=false;document.querySelector('.brand')?.classList.remove('busy')}}
root.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-screen],[data-layer],[data-select],[data-demo],[data-node],[data-batch],[data-tensor]');if(!target)return;
 if(target.dataset.screen){setScreen(target.dataset.screen);return}if(target.dataset.demo){switchDemo(target.dataset.demo);return}if(target.dataset.batch){S.batch=Number(target.dataset.batch);render();return}if(target.dataset.layer!==undefined){S.layer=Number(target.dataset.layer);changeDepth('layer');return}if(target.dataset.select){S.selected=target.dataset.select;if(target.dataset.select==='transformer'){changeDepth('overview');S.selected='transformer';render()}else{S.depth='overview';resetView();render()}return}if(target.dataset.node){selectNode(target.dataset.node);return}if(target.dataset.tensor){S.selected='model';banner(target.dataset.tensor);return}
 const a=target.dataset.action;switch(a){case 'file':document.getElementById('filePicker').click();break;case 'folder':document.getElementById('folderPicker').click();break;case 'export':exportData();break;case 'to-layer':changeDepth('layer');break;case 'to-ffn':changeDepth('internals');break;case 'tensors':setScreen('tensors');break;case 'back':changeDepth(S.depth==='internals'?'layer':'overview');break;case 'fit':resetView();updateViewBox();break;case 'zoom-in':graphZoom(.80);break;case 'zoom-out':graphZoom(1.25);break;case 'toggle-layers':S.showAllLayers=!S.showAllLayers;render();break;case 'prev-page':S.page=Math.max(0,S.page-1);render();break;case 'next-page':S.page++;render();break;}}
);
root.addEventListener('input',e=>{if(e.target.id==='layerSearch'||e.target.id==='tensorSearch'){let id=e.target.id,oldPos=e.target.selectionStart;S[id==='layerSearch'?'layerSearch':'search']=e.target.value;if(id==='tensorSearch')S.page=0;render();let newInput=document.getElementById(id);newInput?.focus();newInput?.setSelectionRange(oldPos,oldPos)}if(e.target.id==='ctxSlider'){S.ctx=2**Number(e.target.value);render()}});
document.getElementById('filePicker').addEventListener('change',e=>{loadFiles(e.target.files);e.target.value=''});
document.getElementById('folderPicker').addEventListener('change',e=>{loadFiles(e.target.files);e.target.value=''});
let dragCounter=0;window.addEventListener('dragenter',e=>{if(e.dataTransfer?.types?.includes('Files')){dragCounter++;if(!document.querySelector('.drop-overlay'))document.body.insertAdjacentHTML('beforeend','<div class="drop-overlay"><div class="drop-box">⬡<br/><br/>Перетащите файлы модели сюда<br/><small style="font-size:14px;font-weight:500;color:#94a6c3">GGUF · SafeTensors · config.json</small></div></div>')}});window.addEventListener('dragover',e=>{e.preventDefault()});window.addEventListener('dragleave',()=>{dragCounter=Math.max(0,dragCounter-1);if(!dragCounter)document.querySelector('.drop-overlay')?.remove()});window.addEventListener('drop',e=>{e.preventDefault();dragCounter=0;document.querySelector('.drop-overlay')?.remove();loadFiles(e.dataTransfer.files)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')root.querySelector('.menu-open .mobile-close')?.click()});
render();
})();

</script>
</body></html>

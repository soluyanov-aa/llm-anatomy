function t(key,...values){

 if(!text||language==='ru')return text;

 for (const [key, max] of Object.entries(STRUCTURE_LIMITS)) {

 for(let i=0;i<nM;i++){let key=await c.str(true),type=await c.num(4);let keep=key.startsWith('general.')||key.includes('.expert')||key.includes('.attention.')||key.includes('.block_count')||key.includes('.embedding_length')||key.includes('.context_length')||key.includes('.feed_forward_length')||key==='tokenizer.ggml.tokens'||key==='tokenizer.ggml.model'; let value=await c.value(type);if(keep && Object.keys(metadata).length<META_LIMIT)metadata[key]=value;}

async function parseSafeTensors(file){let header=new DataView(await file.slice(0,8).arrayBuffer());if(header.byteLength<8)throw Error(t("Файл SafeTensors слишком короткий"));let size=Number(header.getBigUint64(0,true));if(!Number.isSafeInteger(size)||size<2||size>128*1024*1024||size+8>file.size)throw Error(t("Некорректная длина заголовка SafeTensors"));let raw=await file.slice(8,8+size).text();let parsed=JSON.parse(raw);let tensors=[];for(const [name,v] of Object.entries(parsed)){if(name==='__metadata__')continue;if(!Array.isArray(v.shape)||typeof v.dtype!=='string')continue;let bytes=Array.isArray(v.data_offsets)?v.data_offsets[1]-v.data_offsets[0]:null;tensors.push(tensorInfo(name,v.shape,v.dtype,bytes));}

function estimateMemory(m, requested, batch=1) {
 const context=Math.min(requested,m.context||requested);
 const layers=m.layers||32, heads=m.heads||32, kvHeads=m.kvHeads||heads, d=m.hidden/heads||128;
 const kv=2*layers*kvHeads*d*context*batch*2/1024**3;
 const bytes=m.weightsSize !== undefined ? m.weightsSize : m.format==='Config JSON' ? null : m.fileSize;
 const weightsKnown=Number.isFinite(bytes)&&bytes>=0&&!m.partial;
 const weights=weightsKnown?bytes/1024**3:null;
 const buffer=weightsKnown?Math.max(1,weights*.08):null;
 return {context,kv,weights,buffer,total:weightsKnown?weights+kv+buffer:null,weightsKnown};
}

}
function breadcrumb(){return S.depth==='overview'?'Модель / Общая архитектура':S.depth==='layer'?`Модель / Transformer / Layer ${S.layer}`:`Модель / Layer ${S.layer} / ${S.model.isMoe?'MoE Experts':'Dense FFN'}`}
function graphViz(){const page=S.depth;let body=page==='overview'?graphOverview():page==='layer'?graphLayer():graphInternals();let canonicalHeight=page==='layer'?900:page==='overview'?800:800;let vb=S.view;if(vb.h!==canonicalHeight && vb.w===860){vb={x:0,y:0,w:860,h:canonicalHeight};S.view=vb;}return `<section class="section-box"><div class="viz-head"><div><div class="viz-title">Структурная схема <span style="color:#65748c;font-weight:500">/ ${esc(page==='overview'?'Overview':page==='layer'?'Transformer layer':'FFN internals')}</span></div><div class="viz-hint">${esc(breadcrumb())}</div></div><div class="viz-controls">${page!=='overview'?button('← Назад','back','tiny-btn'):''}${button('−','zoom-out','icon-btn')}${button('+','zoom-in','icon-btn')}${button('⤢','fit','icon-btn')}</div></div><div class="stage"><svg id="graph" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${graphDefs}${body}</svg><div class="stage-pill">${page==='overview'?'01 / Обзор модели':page==='layer'?`02 / Layer ${S.layer}`:'03 / Внутренний блок'} &nbsp; · &nbsp; ${'ЛОКАЛЬНЫЕ ДАННЫЕ'}</div><div class="stage-bottom"><span class="legend-dot"></span> Dense / универсальные блоки &nbsp; <span class="legend-dot green"></span> MoE / experts</div></div><div class="viz-footer"><span>◇ Масштабирование колесом / + −</span><span>✋ Перемещение перетаскиванием</span><span class="push">${S.depth==='overview'?'Нажмите на Transformer или FFN':S.depth==='layer'?'Нажмите на FFN / MoE для детализации':'Стрелки показывают логические зависимости'}</span></div></section><div class="bottom-note"><span class="note-ico">ⓘ</span><div><h3>${'Структура реконструирована по метаданным и именам тензоров'}</h3><p>Граф показывает типовую архитектуру семейства Transformer. Точные операции, размещение residual-связей и routing определяются кодом реализации. Маршруты экспертов в демонстрации условные: фактические активации требуют выполнения модели.</p></div></div>`}
function filterTensor(){let q=S.search.toLowerCase().trim();return q?S.model.tensors.filter(t=>t.name.toLowerCase().includes(q)||t.dtype.toLowerCase().includes(q)):S.model.tensors}
function tensorPanel(){let arr=filterTensor(),p=clamp(S.page,0,Math.max(0,Math.ceil(arr.length/20)-1)),slice=arr.slice(p*20,p*20+20);S.page=p;return `<div class="section-intro"><h2>Каталог тензоров</h2><p>Поиск по именам, размерностям и типам хранения. Отображаются метаданные файлов — значения весов не загружаются.</p></div><section class="table-panel"><div class="table-tools"><div><h2>${compact(S.model.tensors.length,0)} тензоров</h2><p>${'Из заголовков выбранных файлов'}</p></div><div class="filter-box">⌕ <input id="tensorSearch" value="${esc(S.search)}" placeholder="Поиск по имени или dtype…"/></div></div><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Тензор</th><th>Размерность</th><th>Тип</th><th>Элементов</th></tr></thead><tbody>${slice.map(t=>`<tr data-tensor="${esc(t.name)}" style="cursor:pointer"><td class="mono" title="${esc(t.name)}">${esc(t.name)}</td><td>${esc(t.shape.join(' × '))}</td><td><span class="chip ${/Q|IQ/.test(t.dtype)?'purple':'green'}">${esc(t.dtype)}</span></td><td>${paramsFmt(t.elements)}</td></tr>`).join('')||`<tr><td colspan="4" style="text-align:center;color:#7c8ca5;padding:45px">Ничего не найдено</td></tr>`}</tbody></table></div><div class="table-foot"><span>${arr.length?`${p*20+1}–${Math.min((p+1)*20,arr.length)} из ${arr.length}`:'0 из 0'} ${S.model.partial?'· неполный набор':''}</span><div class="paging"><button data-action="prev-page" ${p===0?'disabled':''}>← Назад</button><button data-action="next-page" ${p>=Math.ceil(arr.length/20)-1?'disabled':''}>Далее →</button></div></div></section>`}
function calculateMemory(){const r=estimateMemory(S.model,S.ctx,S.batch);return {...r,extra:r.buffer,ctx:r.context};}
function memoryPanel(){const {kv,weights,extra,total,ctx,weightsKnown}=calculateMemory();const gpus=[{name:'NVIDIA RTX 5090',capacity:32,sub:'32 GB GDDR7 · одна видеокарта'},{name:'Ryzen AI Max+ 395',capacity:96,sub:'до 96 GB UMA · зависит от настройки'},{name:'6 × Tesla P40',capacity:144,sub:'6 × 24 GB · не единый пул памяти'}];const gauge=(n,cap,cls)=>`<div class="${cls}" style="width:${Math.min(100,n/cap*100)}%"></div>`;
 return `<div class="section-intro"><h2>Планировщик памяти</h2><p>Оценка минимальной памяти для весов и KV-cache. Не учитывает все особенности backend, offload, временные буферы и распределение по устройствам.</p></div><div class="memory-tools"><label>Контекст &nbsp;<strong>${compact(ctx/1024,0)}K токенов</strong> &nbsp; (batch: ${S.batch})</label><input id="ctxSlider" type="range" min="11" max="17" value="${Math.round(Math.log2(S.ctx))}" step="1"/><div style="display:flex;gap:6px">${[1,2,4].map(b=>`<button class="tiny-btn" style="${S.batch===b?'border-color:#8976ff;color:#d3caff':''}" data-batch="${b}">B${b}</button>`).join('')}</div></div><div class="memory-breakdown">${[['Веса на диске',weights],['KV-cache FP16',kv],['Условный резерв',extra]].map(([label,n],i)=>`<div class="breakdown-card"><span>${label}</span><strong style="color:${['#b6a7ff','#81e1d4','#f4c18b'][i]}">${n==null?'Неизвестно':compact(n,2)+' GB'}</strong></div>`).join('')}</div><div class="memory-legend"><span><i style="background:#8c76f9"></i>Веса</span><span><i style="background:#55d2c4"></i>KV-cache</span><span><i style="background:#e4a770"></i>Резерв</span></div><div class="memory-cards list-focus">${gpus.map(g=>`<div class="memory-card"><div class="eyebrow">Устройство</div><h3>${g.name}</h3><div class="capacity">${g.sub}</div><div class="memory-gauge">${gauge(weights,g.capacity,'weights')}${gauge(kv,g.capacity,'kv')}${gauge(extra,g.capacity,'extra')}</div><div class="memory-value" style="color:${!weightsKnown?'#889ab3':total<=g.capacity?'#bdcafa':'#e8ad84'}">${weightsKnown?compact(total,1):'—'} / ${g.capacity} GB</div><div class="memory-status">${!weightsKnown?'Недостаточно данных о весах':total<=g.capacity?'✓ Теоретически по объёму помещается':'⚠ Оценка превышает объём'}${g.name.includes('P40')?' · потребуется распределение весов':''}</div></div>`).join('')}</div><div class="bottom-note"><span class="note-ico">ⓘ</span><div><h3>Ограничения оценки</h3><p>Для GGUF объём файла принят за приближённый размер весов; в SafeTensors значения могут быть иными после загрузки и конвертации. KV-cache оценён как FP16: 2 × слои × KV-головы × размер головы × контекст × batch. MoE не уменьшает общий объём весов автоматически.</p></div></div>`}
function getComponent(){const m=S.model,sel=S.selected;let res={title:'Transformer block',path:'model.layers',desc:'Повторяющийся блок модели, включающий внимание, нормализацию, residual-связи и FFN/MoE.',icon:'▤',tone:'violet',props:[['Количество слоёв',numfmt(m.layers)],['Размер скрытого состояния',numfmt(m.hidden)],['Тип FFN',m.isMoe?'Mixture of Experts':'Dense MLP']],terms:['blk.0.','layers.0.']};
 const item=(title,path,desc,icon,props,terms=[],tone='violet')=>({title,path,desc,icon,props,terms,tone});
 if(sel==='model')res=item('Модель целиком',m.fileName,'Набор метаданных и тензоров. Для точного вычислительного графа нужен также исходный код архитектуры.','⬡',[['Формат',m.format],['Архитектура',m.arch],['Параметры',paramsFmt(m.params)],['Тензоры',compact(m.tensors.length,0)],['Источник','Локальный файл']]);
 if(sel==='tokens')res=item('Tokens','tokenizer','Текст преобразуется токенизатором в идентификаторы токенов. Сам токенизатор может находиться в отдельном файле.','✣',[['Словарь',numfmt(m.vocab)],['Контекст',numfmt(m.context)]]);
 if(sel==='embedding')res=item('Token embeddings','token_embd / embed_tokens','Таблица векторов, которая преобразует ID токена в скрытое представление модели.','◈',[['Ширина hidden',numfmt(m.hidden)],['Размер словаря',numfmt(m.vocab)]],['token_embd','embed_tokens','wte']);
 if(sel==='attention')res=item('Self Attention',`blocks.${S.layer}.attn`,'Механизм взаимодействия токенов через Q, K, V и выходную проекцию. В типовом GQA несколько query-голов используют общие key/value-головы.','◎',[['Query heads',numfmt(m.heads)],['KV heads',numfmt(m.kvHeads)],['Head dimension',m.heads?numfmt(m.hidden/m.heads):'—']],['attn_','self_attn','attention.']);
 if(sel==='moe'||sel==='router'||sel.startsWith('expert')){const expert=sel.startsWith('expert');res=item(expert?`Expert ${sel.split('-')[1]}`:sel==='router'?'Router / Gating':'Mixture of Experts',`blocks.${S.layer}.moe`,'Разреженная FFN: маршрутизатор определяет вклад отдельных экспертов. При вычислении выбирается подмножество, но веса остальных экспертов также должны храниться.','⬡',[['Всего экспертов',numfmt(m.experts)],['Активных на токен',numfmt(m.activeExperts)],['Вид блока','Sparse MoE']],['ffn_','experts','router','block_sparse_moe'],'teal');}
 if(sel==='ffn'||sel.includes('proj')||sel==='activation')res=item('Feed Forward Network',`blocks.${S.layer}.ffn`,'Преобразование признаков отдельно для каждого токена. В плотном варианте используются полные проекции Gate, Up и Down (например, SwiGLU).','✳',[['FFN width',numfmt(m.ffn)],['Hidden width',numfmt(m.hidden)],['Выполнение','На каждом токене']],['ffn_','mlp.','gate_proj','up_proj','down_proj']);
 if(sel.includes('norm')||sel==='normalization')res=item('Normalization',`blocks.${S.layer}.norm`,'Нормализует представления. В зависимости от архитектуры может использоваться RMSNorm или LayerNorm.','≈',[['Размер вектора',numfmt(m.hidden)],['Тип','Зависит от архитектуры']],['norm']);
 if(sel==='output')res=item('Language Modeling Head','output / lm_head','Проекция скрытого состояния в логиты словаря, по которым алгоритм декодирования выбирает следующий токен.','➤',[['Размер словаря',numfmt(m.vocab)],['Выходных значений',numfmt(m.vocab)]],['output.weight','lm_head']);
 if(sel==='merge')res=item('Expert aggregation','moe.combine','Объединяет выходы выбранных экспертов с учётом весов маршрутизатора.','∑',[['Выходной hidden',numfmt(m.hidden)],['Активных экспертов',numfmt(m.activeExperts)]],['experts'],'teal');
 return res;}
function inspector(){let m=S.model,c=getComponent();let terms=c.terms||[];let matches=terms.length?m.tensors.filter(t=>terms.some(s=>t.name.includes(s))&&(S.depth==='overview'||t.name.includes(`.${S.layer}.`)||t.name.includes(`layers.${S.layer}.`)||t.name.includes(`blk.${S.layer}.`))).slice(0,4):[];return `<aside class="inspector"><div class="ins-head"><div class="eyebrow">Инспектор компонентов</div><h2>Свойства элемента</h2><p>Нажмите на любой блок схемы, чтобы увидеть его параметры.</p></div><div class="ins-body"><div class="component-symbol ${c.tone==='teal'?'teal':''}">${c.icon}</div><div class="component-name">${esc(c.title)}</div><span class="chip ${'green'}">${'ПО МЕТАДАННЫМ'}</span><div class="component-path" title="${esc(c.path)}">${esc(c.path)}</div><div class="component-desc">${esc(c.desc)}</div><div class="property-title">Параметры <span>⦿</span></div>${c.props.map(([k,v])=>`<div class="property-row"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}<div class="property-title">Связанные тензоры <span>${matches.length?`≥ ${matches.length}`:'—'}</span></div>${matches.length?matches.map(t=>`<div class="tensor-entry"><div class="tensor-name" title="${esc(t.name)}">${esc(t.name)}</div><div class="tensor-shape">${esc(t.shape.join(' × '))} &nbsp;·&nbsp; ${esc(t.dtype)}</div></div>`).join(''):`<div class="ins-empty">${'Нет подходящих тензоров в выбранном файле.'}</div>`}<div class="ins-action">${S.depth==='overview'?button('↳ Раскрыть слой','to-layer','soft-btn'):S.depth==='layer'?button('↳ Внутрь FFN','to-ffn','soft-btn'):button('← К слою','back','soft-btn')}${button('▦ Тензоры','tensors','soft-btn')}</div><div class="property-title">Уровень уверенности</div><div class="component-desc" style="color:#889ab3">${'Параметры основаны на метаданных; топология является реконструкцией типового Transformer.'}</div></div></aside>`}
let collapsed=false;try{collapsed=localStorage.getItem('llm-sidebar-collapsed')==='true'}catch{};
function dashboard(){
 const shell=root.querySelector('.app-shell');shell.classList.add('dashboard');shell.classList.toggle('collapsed',collapsed);
 const sidebar=root.querySelector('.sidebar'),header=root.querySelector('.topbar');
 sidebar.prepend(header.querySelector('.brand'));const title=document.createElement('strong');title.textContent='Анатомия модели';header.prepend(title);if(S.model){const name=document.createElement('span');name.className='header-model-name';name.textContent=S.model.name;title.after(name)}header.querySelector('.top-mid')?.remove();
 const toggle=document.createElement('button');toggle.className='icon-btn collapse-toggle';toggle.textContent=collapsed?'›':'‹';toggle.setAttribute('aria-label','Свернуть или развернуть меню');toggle.onclick=()=>{collapsed=!collapsed;try{localStorage.setItem('llm-sidebar-collapsed',collapsed)}catch{};render()};sidebar.prepend(toggle);
 sidebar.querySelectorAll('.sb-nav button').forEach(b=>{b.title=b.textContent.trim();b.setAttribute('aria-label',b.title);const icon=b.querySelector('.ico');const label=document.createElement('span');label.className='nav-label';label.textContent=b.title;b.replaceChildren(icon,label)});
 const menu=document.createElement('button');menu.className='icon-btn mobile-menu';menu.textContent='☰';menu.setAttribute('aria-label','Открыть меню');const closeMenu=()=>{shell.classList.remove('menu-open');menu.setAttribute('aria-expanded','false');menu.focus()};menu.setAttribute('aria-expanded','false');menu.onclick=()=>{shell.classList.add('menu-open');menu.setAttribute('aria-expanded','true');close.focus()};header.prepend(menu);
 const backdrop=document.createElement('button');backdrop.className='menu-backdrop';backdrop.tabIndex=-1;backdrop.setAttribute('aria-label','Закрыть меню по фону');backdrop.onclick=closeMenu;shell.append(backdrop);
 const close=document.createElement('button');close.className='icon-btn mobile-close';close.textContent='×';close.setAttribute('aria-label','Закрыть меню');close.onclick=closeMenu;sidebar.prepend(close);
 const tree=sidebar.querySelector('section');if(tree&&S.screen==='architecture'){tree.classList.add('architecture-tree');root.querySelector('.main').append(tree)}else{tree?.remove();root.querySelector('.inspector')?.remove()}
}
function render(){root.innerHTML=`<div class="app-shell">${topbar()}<div class="workspace">${sideNav()}<main class="main">${S.model?heading():''}${!S.model?'<section class="empty-model"><h1>Выберите модель</h1><p>Откройте GGUF, SafeTensors или config.json для всех разделов.</p><button class="primary-btn" data-action="file">Открыть модель</button></section>':S.screen==='architecture'?graphViz():S.screen==='tensors'?tensorPanel():memoryPanel()}</main>${S.model?inspector():''}</div></div>${S.toast?`<div class="toast">${esc(S.toast)}</div>`:''}`;dashboard();wireGraph();}
function resetView(){let h=S.depth==='layer'?900:800;S.view={x:0,y:0,w:860,h};}
function changeDepth(d){S.depth=d;S.selected=d==='overview'?'transformer':d==='layer'?'attention':S.model.isMoe?'router':'ffn';resetView();render()}
function selectNode(id){S.selected=id;if(id==='transformer'&&S.depth==='overview')S.depth='layer';else if((id==='moe'||id==='ffn')&&S.depth!=='internals')S.depth='internals';else if(id==='attention'&&S.depth==='overview')S.depth='layer';else if(id.startsWith('expert-')&&S.depth!=='internals')S.depth='internals';resetView();render()}
function setScreen(screen){S.screen=screen;render()}
function exportData(){let m=S.model;if(!m)return;let blob=new Blob([JSON.stringify({...m,tensors:m.tensors.slice(0,20000)},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${m.name.replace(/[^a-z0-9-]+/ig,'_')}-anatomy.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function graphZoom(factor){let b=S.view,cx=b.x+b.w/2,cy=b.y+b.h/2;let w=clamp(b.w*factor,300,1800),h=clamp(b.h*factor,300,1800);S.view={x:cx-w/2,y:cy-h/2,w,h};updateViewBox()}
function updateViewBox(){let g=document.querySelector('#graph');if(g)g.setAttribute('viewBox',`${S.view.x} ${S.view.y} ${S.view.w} ${S.view.h}`)}
function wireGraph(){let g=document.querySelector('#graph');if(!g)return;g.addEventListener('wheel',e=>{e.preventDefault();graphZoom(e.deltaY>0?1.13:1/1.13)},{passive:false});let p=null;g.addEventListener('pointerdown',e=>{if(e.target.closest('.graph-node'))return;p={x:e.clientX,y:e.clientY,view:{...S.view}};g.classList.add('dragging');g.setPointerCapture(e.pointerId)});g.addEventListener('pointermove',e=>{if(!p)return;let box=g.getBoundingClientRect(),scale=Math.max(p.view.w/box.width,p.view.h/box.height);S.view.x=p.view.x-(e.clientX-p.x)*scale;S.view.y=p.view.y-(e.clientY-p.y)*scale;updateViewBox()});const end=()=>{p=null;g.classList.remove('dragging')};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);}
async function loadFiles(files){if(!files?.length)return;const prev=S.model;S.loading=true;document.querySelector('.brand').classList.add('busy');try{let model=await openModelFiles(files);S.model=model;S.layer=0;S.depth='overview';S.selected='transformer';S.screen='architecture';S.search='';S.page=0;S.layerSearch='';resetView();render();banner(`Открыто: ${model.name}. Найдено ${compact(model.tensors.length,0)} тензоров.`)}catch(err){S.model=prev;banner('Не удалось прочитать файл: '+err.message)}finally{S.loading=false;document.querySelector('.brand')?.classList.remove('busy')}}
root.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-screen],[data-layer],[data-select],[data-node],[data-batch],[data-tensor]');if(!target)return;
 if(target.dataset.screen){setScreen(target.dataset.screen);return}if(target.dataset.batch){S.batch=Number(target.dataset.batch);render();return}if(target.dataset.layer!==undefined){S.layer=Number(target.dataset.layer);changeDepth('layer');return}if(target.dataset.select){S.selected=target.dataset.select;if(target.dataset.select==='transformer'){changeDepth('overview');S.selected='transformer';render()}else{S.depth='overview';resetView();render()}return}if(target.dataset.node){selectNode(target.dataset.node);return}if(target.dataset.tensor){S.selected='model';banner(target.dataset.tensor);return}
 const a=target.dataset.action;switch(a){case 'file':document.getElementById('filePicker').click();break;case 'folder':document.getElementById('folderPicker').click();break;case 'export':exportData();break;case 'to-layer':changeDepth('layer');break;case 'to-ffn':changeDepth('internals');break;case 'tensors':setScreen('tensors');break;case 'back':changeDepth(S.depth==='internals'?'layer':'overview');break;case 'fit':resetView();updateViewBox();break;case 'zoom-in':graphZoom(.80);break;case 'zoom-out':graphZoom(1.25);break;case 'toggle-layers':S.showAllLayers=!S.showAllLayers;render();break;case 'prev-page':S.page=Math.max(0,S.page-1);render();break;case 'next-page':S.page++;render();break;}}
);
root.addEventListener('input',e=>{if(e.target.id==='layerSearch'||e.target.id==='tensorSearch'){let id=e.target.id,oldPos=e.target.selectionStart;S[id==='layerSearch'?'layerSearch':'search']=e.target.value;if(id==='tensorSearch')S.page=0;render();let newInput=document.getElementById(id);newInput?.focus();newInput?.setSelectionRange(oldPos,oldPos)}if(e.target.id==='ctxSlider'){S.ctx=2**Number(e.target.value);render()}});
document.getElementById('filePicker').addEventListener('change',e=>{loadFiles(e.target.files);e.target.value=''});
document.getElementById('folderPicker').addEventListener('change',e=>{loadFiles(e.target.files);e.target.value=''});
let dragCounter=0;window.addEventListener('dragenter',e=>{if(e.dataTransfer?.types?.includes('Files')){dragCounter++;if(!document.querySelector('.drop-overlay'))document.body.insertAdjacentHTML('beforeend','<div class="drop-overlay"><div class="drop-box">⬡<br/><br/>Перетащите файлы модели сюда<br/><small style="font-size:14px;font-weight:500;color:#94a6c3">GGUF · SafeTensors · config.json</small></div></div>')}});window.addEventListener('dragover',e=>{e.preventDefault()});window.addEventListener('dragleave',()=>{dragCounter=Math.max(0,dragCounter-1);if(!dragCounter)document.querySelector('.drop-overlay')?.remove()});window.addEventListener('drop',e=>{e.preventDefault();dragCounter=0;document.querySelector('.drop-overlay')?.remove();loadFiles(e.dataTransfer.files)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')root.querySelector('.menu-open .mobile-close')?.click()});
render();
})();

</script>
</body></html>
